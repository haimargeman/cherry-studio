name: Compare Hebrew i18n Against Main

on:
  push:
    branches: [hebrew-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: i18n on ${{ matrix.branch }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        branch: [main, hebrew-validation]
    steps:
      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run i18n lint and capture result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm i18n:lint 2>&1 | Tee-Object -FilePath i18n-lint-result.txt
          $status = $LASTEXITCODE
          "Exit code: $status" | Add-Content i18n-lint-result.txt
          "### ${{ matrix.branch }} — i18n lint" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Exit code: $status" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) {
            "Review the uploaded log for exact findings." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Upload full i18n log
        uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ matrix.branch }}
          path: i18n-lint-result.txt
          if-no-files-found: error
          retention-days: 7
