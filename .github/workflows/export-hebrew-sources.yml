
name: Export Hebrew Sources to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect translation sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p export

          for dir in \
            src/renderer/i18n \
            src/main/i18n \
            src/renderer/styles \
            packages \
            .github/workflows; do
            if [ -d "$dir" ]; then
              mkdir -p "export/$dir"
              cp -a "$dir/." "export/$dir/"
            fi
          done

          if [ -d src/renderer/src ]; then
            find src/renderer/src -type f \( \
              -iname '*locale*' -o \
              -iname '*i18n*' -o \
              -iname '*language*' -o \
              -iname '*direction*' \
            \) -exec cp --parents {} export/ \;
          fi

          for file in \
            i18next.config.ts \
            package.json \
            pnpm-workspace.yaml \
            electron-builder.yml \
            electron.vite.config.ts \
            AGENTS.md \
            CONTRIBUTING.i18n.yaml; do
            if [ -f "$file" ]; then
              cp "$file" export/
            fi
          done

          cd export
          zip -qr ../cherry-hebrew-sources.zi .
          cd ..

          ls -lh cherry-hebrew-sources.zi

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: hebrew-sources-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            cherry-hebrew-sources.zi \
            --title "Hebrew Translation Sources $TAG" \
            --notes "Source files for Cherry Studio Hebrew localization." \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
