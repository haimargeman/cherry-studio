name: Build Hebrew Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare native dependencies
        shell: pwsh
        run: |
          pnpm download:binaries
          pnpm rebuild:electron
      - name: Hebrew prebuild gates - TypeScript
        run: pnpm typecheck
      - name: Hebrew prebuild gates - Lint
        run: pnpm lint
      - name: Hebrew prebuild gates - i18n
        run: pnpm i18n:lint
      - name: Build Windows x64 unsigned
        run: pnpm build:win:x64
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-hebrew-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
